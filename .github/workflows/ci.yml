name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA is the head of the upstream `stable` branch as of 2026-08-02
      # (dtolnay/rust-toolchain publishes no release tags for it). The branch
      # ref previously supplied the toolchain choice, so it is now explicit.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets

  # The npm channel is published only from a tag, so nothing else would notice
  # a broken wrapper or a platform package the workflow forgot until the
  # version carrying the mistake was already on the registry and unpublishable
  # over. This job needs no Rust and no network: Node is preinstalled on the
  # runner image, and the check installs its own stub binary.
  npm-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check the npm channel
        run: node .github/scripts/npm-channel-check.js
