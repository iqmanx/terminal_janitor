# Release artefacts for terminal_janitor.
#
# `ACCEPTANCE.md` section A requires checksummed artefacts for the supported
# targets. Every artefact is built by this workflow from a tagged commit; none
# is ever uploaded from a developer machine, so the checksums describe exactly
# what the repository contained.
#
# `workflow_dispatch` builds and uploads the artefacts to the run without
# publishing a release, which is how the release qualification exercises the
# real artefacts before anyone decides to tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Built on Apple Silicon rather than an Intel runner. The macOS SDK
          # ships both slices, so this is a first-class native cross-compile,
          # and it does not depend on the Intel runner image GitHub is
          # retiring. Nothing is executed here, only built; the x86_64 binary
          # is exercised by whoever runs it on an Intel Mac.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # One executable per archive, named exactly `terminal_janitor`, so the
      # installers can unpack without inspecting the archive's shape.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="terminal_janitor-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/terminal_janitor.exe" .
            7z a "dist/$name.zip" terminal_janitor.exe >/dev/null
          else
            cp "target/${{ matrix.target }}/release/terminal_janitor" .
            tar -czf "dist/$name.tar.gz" terminal_janitor
          fi
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artefact-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: incoming
          merge-multiple: true

      # One SHA256SUMS covering every artefact, in the format both installers
      # parse. The installers refuse to unpack anything that is not listed here
      # or whose hash does not match.
      - name: checksum every artefact
        run: |
          set -euo pipefail
          mkdir -p dist
          mv incoming/* dist/
          cd dist
          sha256sum ./* > SHA256SUMS
          # `sha256sum ./*` writes "./name"; the installers match on the bare
          # file name, so strip the prefix.
          sed -i 's| \./| |' SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artefacts
          path: dist/*
          if-no-files-found: error

  publish:
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artefacts
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Checksums are in SHA256SUMS. Scheduling is opt-in: run \`terminal_janitor enable\`." \
            dist/*

  # The npm channel repackages the artefacts this run already built and
  # checksummed; it never compiles anything of its own. It runs after the
  # GitHub release so a version can never exist on npm without the release and
  # checksums it was cut from.
  #
  # Node and npm are preinstalled on the runner image, so no action is needed
  # to provide them.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm reads an OIDC token directly to attach a provenance attestation,
      # which is what lets anyone verify these packages came from this workflow
      # at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Both conditions this job cannot satisfy are knowable before anything is
      # downloaded, and both would otherwise surface at the very last step —
      # after the GitHub release exists, leaving a tagged version the README
      # says is installable from npm and is not. They are checked first, and
      # the failure names the fix rather than the symptom.
      - name: refuse before the registry is touched
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The push payload carries the repository's visibility, so this costs
          # no API call and cannot be affected by the token above.
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::the NPM_TOKEN secret is empty or unset, so the" \
              "publish step would fail with ENEEDAUTH. Add a granular npm" \
              "automation token with publish rights to the repository" \
              "secrets, or delete this job." >&2
            exit 1
          fi

          # npm signs provenance into a public transparency log and requires
          # the source repository to be public to do it. `README.md` promises
          # every package carries that attestation, so publishing without it
          # here would make the promise false rather than make the job pass.
          if [ "${VISIBILITY}" != public ]; then
            echo "::error::provenance requires a public source repository," \
              "and this one is ${VISIBILITY}. Either make the repository" \
              "public before tagging, or drop --provenance here and remove" \
              "the attestation claim from README.md and the npm README." >&2
            exit 1
          fi

      # The npm version is what a user sees; the binary reports its own. A tag
      # that disagrees with Cargo.toml would ship `terminal_janitor@0.2.0`
      # whose `--version` says something else, and nothing downstream would
      # notice.
      - name: check the tag against the crate version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate="$(awk '
            /^\[/ { table = $0 }
            table == "[package]" && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ' Cargo.toml)"
          test -n "$crate"
          if [ "$version" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} would publish npm version" \
              "${version}, but Cargo.toml says ${crate}. Tag the crate" \
              "version, or bump the crate before tagging." >&2
            exit 1
          fi
          echo "tag and crate agree on ${version}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artefacts
          path: dist

      # The same refusal the installers make: nothing is unpacked before its
      # checksum is confirmed, even though this run produced it minutes ago.
      - name: verify the artefacts before unpacking
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS

      - name: place each binary in its platform package
        run: |
          set -euo pipefail

          # Unpacks one release archive into the platform package that ships it.
          # Every call names a target the build matrix above actually produces,
          # and asserts the executable landed, so a renamed or missing artefact
          # fails this job rather than publishing an empty package.
          place() {
            target="$1" package="$2" kind="$3"
            dest="npm/$package/bin"
            mkdir -p "$dest"
            if [ "$kind" = zip ]; then
              unzip -o "dist/terminal_janitor-$target.zip" \
                terminal_janitor.exe -d "$dest"
              test -f "$dest/terminal_janitor.exe"
            else
              tar -xzf "dist/terminal_janitor-$target.tar.gz" \
                -C "$dest" terminal_janitor
              chmod 755 "$dest/terminal_janitor"
              test -x "$dest/terminal_janitor"
            fi
            echo "$package <- terminal_janitor-$target"
          }

          place x86_64-unknown-linux-gnu  terminal_janitor-linux-x64    tar
          place aarch64-unknown-linux-gnu terminal_janitor-linux-arm64  tar
          place x86_64-apple-darwin       terminal_janitor-darwin-x64   tar
          place aarch64-apple-darwin      terminal_janitor-darwin-arm64 tar
          place x86_64-pc-windows-msvc    terminal_janitor-win32-x64    zip

      # npm bundles a LICENSE automatically, but only one found inside the
      # package directory, and this repository keeps a single licence at the
      # root. Without this copy every package would declare `"license": "MIT"`
      # while shipping no licence text at all: a claim with nothing behind it.
      - name: give every package the licence it declares
        run: |
          set -euo pipefail
          test -f LICENSE
          for package in npm/*/; do
            cp LICENSE "$package/LICENSE"
          done
          ls npm/*/LICENSE

      # One version across every package, taken from the tag, with the wrapper's
      # optional dependencies pinned exactly. A range would let npm pair a
      # wrapper with a platform binary it was never released against.
      - name: stamp the version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for package in terminal_janitor-linux-x64 terminal_janitor-linux-arm64 \
                         terminal_janitor-darwin-x64 terminal_janitor-darwin-arm64 \
                         terminal_janitor-win32-x64; do
            (cd "npm/$package" && npm pkg set "version=$version")
            (cd npm/terminal_janitor &&
               npm pkg set "optionalDependencies.$package=$version")
          done
          (cd npm/terminal_janitor && npm pkg set "version=$version")
          (cd npm/terminal_janitor && npm pkg get version optionalDependencies)

      # Platform packages first. The wrapper depends on them by exact version,
      # so publishing it first would leave a window where installing it
      # resolves nothing runnable.
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          trap 'rm -f ~/.npmrc' EXIT
          version="${GITHUB_REF_NAME#v}"

          # A publish that fails partway through leaves some packages on the
          # registry and some not, and npm refuses to overwrite a version that
          # already exists. Without this check the re-run needed to finish the
          # set is exactly the run npm rejects, and the only way out is a new
          # version for a release that was never the problem. Skipping what is
          # already there makes this step resumable; it still cannot overwrite
          # anything, because a version already on the registry is never
          # republished.
          release_package() {
            package="$1"
            name="$(node -p "require('./npm/$package/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; leaving it untouched"
              return 0
            fi
            npm publish "npm/$package" --provenance --access public
          }

          for package in terminal_janitor-linux-x64 terminal_janitor-linux-arm64 \
                         terminal_janitor-darwin-x64 terminal_janitor-darwin-arm64 \
                         terminal_janitor-win32-x64; do
            release_package "$package"
          done
          release_package terminal_janitor
